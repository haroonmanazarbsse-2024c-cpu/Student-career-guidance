<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f7f6; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .form-container { background: #ffffff; padding: 40px 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        h2 { color: #34495e; font-size: 20px; margin-bottom: 20px; }
        form { display: flex; flex-direction: column; gap: 15px; }
        input[type="email"], input[type="password"] { width: 100%; padding: 14px; border: 1px solid #ccd1d9; border-radius: 8px; font-size: 15px; transition: border-color 0.3s; }
        input:focus { border-color: #3498db; outline: none; }
        .btn { background-color: #3498db; color: white; padding: 14px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: background-color 0.3s ease; }
        .btn:hover { background-color: #2980b9; }
        a.text-link { color: #3498db; text-decoration: none; display: block; margin-top: 18px; font-size: 14px; }
        a.text-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Student Login</h2>
        <form method="POST">
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn">Login</button>
        </form>
        <a href="/register" class="text-link">Create New Account</a>
    </div>
</body>
</html>
