<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendations</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f7f6; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #ffffff; padding: 40px 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 20px; }
        ul.recommendation-list { list-style-type: none; padding: 0; margin-bottom: 25px; }
        ul.recommendation-list li { background: #e8f4f8; color: #2980b9; margin: 10px 0; padding: 12px; border-radius: 8px; font-weight: 500; border-left: 5px solid #3498db; text-align: left; }
        .btn-secondary { background-color: #95a5a6; color: white; padding: 12px 20px; border: none; border-radius: 8px; text-decoration: none; display: inline-block; font-weight: bold; width: 100%; }
        .btn-secondary:hover { background-color: #7f8c8d; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Recommended Careers</h1>
        
        {% if recommendations %}
            <ul class="recommendation-list">
                {% for career in recommendations %}
                    <li>{{ career }}</li>
                {% endfor %}
            </ul>
        {% else %}
            <p style="margin-bottom: 25px; color: #e74c3c; font-weight: 500;">No suitable career found.</p>
        {% endif %}
        
        <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
    </div>
</body>
</html>
